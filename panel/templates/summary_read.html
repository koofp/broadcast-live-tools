{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page %}summary-read{% endblock %}
{% block content %}
<div class="row-actions">
  <a class="btn ghost" href="/summaries">← 返回总结库</a>
  <button class="btn ghost" id="btn-copy-md">复制 Markdown</button>
  <span class="mut">{{ room }} / {{ video }}</span>
</div>
<article class="doc">{{ content | safe }}</article>
<script>window.__COPYMD__={{ content | tojson }};</script>
{% endblock %}

{% block pagejs %}
<script>
App.pageInit.summaryRead = function(){
  App.q('#btn-copy-md').onclick=async()=>{
    try{await navigator.clipboard.writeText(window.__COPYMD__);App.toast('已复制');}
    catch(e){App.toast('复制失败');}
  };
};
</script>
{% endblock %}
