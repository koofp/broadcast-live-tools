{% extends "base.html" %}
{% block title %}分段库{% endblock %}
{% block page %}segments{% endblock %}
{% block content %}
<div class="toolbar">
  <select id="f-room"><option value="">全部房间</option>{% for r in rooms %}<option value="{{ r }}">{{ r }}</option>{% endfor %}</select>
  <select id="f-status">
    <option value="">全部状态</option><option value="none">未处理</option>
    <option value="srt">已转写</option><option value="summary">已总结</option>
  </select>
  <input id="f-q" placeholder="搜索文件名…">
  <span class="mut" style="margin-left:auto">{{ files|length }} 个文件</span>
</div>
<table class="tbl"><thead><tr>
 <th>房间</th><th>文件</th><th>大小</th><th>修改时间</th><th>状态</th><th>操作</th>
</tr></thead><tbody id="rows"></tbody></table>
<p class="mut">提示：正在写入的分段（10 分钟内活跃）不会出现在处理候选里。</p>

<dialog id="dlg"><div class="dlg-head"><b id="dlg-title"></b><button class="btn ghost" onclick="App.q('#dlg').close()">✕</button></div>
<pre id="dlg-body" class="logbox"></pre></dialog>
{% endblock %}

{% block pagejs %}
<script>
App.pageInit.segments = async function(){
  const files = await App.fetchJSON('/api/files'); if(!files) return;
  const rows = App.q('#rows');
  function render(){
    const room=App.q('#f-room').value, st=App.q('#f-status').value, q=App.q('#f-q').value.toLowerCase();
    rows.innerHTML='';
    for(const r of files){
      if(room && r.room!==room) continue;
      if(st==='srt' && (!r.srt||r.summary)) continue;
      if(st==='summary' && !r.summary) continue;
      if(st==='none' && (r.srt||r.summary)) continue;
      if(q && !r.name.toLowerCase().includes(q)) continue;
      const canProc = !r.summary && !r.is_current;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${App.esc(r.room)}</td><td>${App.esc(r.name)}</td><td>${r.size_gb}GB</td><td>${r.mtime}</td>
        <td><span class="badge ${r.status_class}">${r.status_label}</span></td>
        <td class="acts">
          ${r.summary?`<button class="btn ghost" onclick="App.viewSum('${r.room}','${r.name}')">总结</button>
                       <button class="btn ghost" onclick="App.viewSrt('${r.room}','${r.name}')">字幕</button>`:''}
          ${canProc?`<button class="btn" onclick="App.procOne('${r.name}')">${r.srt?'补总结':'转写+总结'}</button>`
                   :(r.is_current?'<span class="mut">录制中…</span>':'')}
        </td>`;
      rows.appendChild(tr);
    }
    if(!rows.children.length) rows.innerHTML='<tr><td colspan="6" class="mut center">无匹配分段</td></tr>';
  }
  App.q('#f-room').onchange=render; App.q('#f-status').onchange=render; App.q('#f-q').oninput=render;
  render();
};
</script>
{% endblock %}
